services:
  db:
    image: postgis/postgis:16-3.4
    container_name: heatsense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heatsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatsense_secure_pass_demo}
      POSTGRES_DB: ${POSTGRES_DB:-heatsense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatsense}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
