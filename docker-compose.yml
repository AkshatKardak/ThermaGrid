services:
  db:
    image: postgis/postgis:16-3.4
    container_name: thermagrid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heatsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatsensepassword}
      POSTGRES_DB: ${POSTGRES_DB:-heatsense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatsense}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thermagrid-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://heatsense:heatsensepassword@db:5432/heatsense}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      ALLOW_SQLITE_FALLBACK: ${ALLOW_SQLITE_FALLBACK:-false}
      ALLOW_SYNTHETIC_RISK: ${ALLOW_SYNTHETIC_RISK:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-dummy_secret_key}
      RESEND_API_KEY: ${RESEND_API_KEY:-dummy_resend_key}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: thermagrid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
