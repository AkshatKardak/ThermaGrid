[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heatsense-analytics"
version = "0.1.0"
description = "Hyperlocal thermal stress, risk modeling, and spatial analytics package for HeatSense India"
authors = [{ name = "HeatSense India Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
