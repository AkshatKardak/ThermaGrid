# Heat Equity & Risk Index Component Weights
# Each weight has an explicit methodology tag: empirical | assumption
version: "2026.1"
weights:
  hazard:
    weight: 0.40
    basis: empirical
    reference: "ISO 7243:2017 Occupational Heat Stress"
  exposure:
    weight: 0.25
    basis: empirical
    reference: "Census of India Ward Population Density"
  vulnerability:
    weight: 0.20
    basis: empirical
    reference: "Informal settlements and outdoor worker fraction"
  adaptive_capacity:
    weight: 0.15
    basis: assumption
    reference: "Tree canopy coverage and cooling center access index"

planner:
  activity_thresholds:
    exercise:
      threshold: 45
      description: "High metabolic heat generation requires lower ambient stress"
    work:
      threshold: 50
      description: "Sustained occupational manual labor with continuous thermal loading"
    walk:
      threshold: 60
      description: "Moderate walking or low-intensity essential errands"
    commute:
      threshold: 65
      description: "Transit commute with intermittent shade and hydration access"
